<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">

<style>
:root{
  --cream:#F0EFE6; --paper:#FAF9F4; --navy:#26325A; --navy-2:#3B4876;
  --orange:#E4632B; --gold:#96803F; --sea:#9ED3E6; --line:#DCD8C8;
  --muted:#6E7188;
  --font:'Montserrat', 'Segoe UI', Roboto, Arial, sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--navy);background:var(--cream);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.app{display:grid;grid-template-columns:380px 1fr;height:100%}
#map{height:100%;background:var(--cream)}
.leaflet-container{font-family:var(--font)}

/* ---------- panel ---------- */
.panel{background:var(--paper);border-right:2px solid var(--navy);display:flex;flex-direction:column;min-height:0;z-index:500;
  padding-top:env(safe-area-inset-top,0px)}
.head{display:flex;align-items:center;gap:14px;padding:20px 22px 14px}
.head img{width:72px;height:72px;border-radius:50%;flex:none}
.head h1{font-size:25px;line-height:1.05;font-weight:900;margin:0;letter-spacing:-.01em}
.head p{margin:5px 0 0;font-size:13px;font-weight:600;color:var(--gold)}

.tools{padding:4px 22px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--navy)}
.search{position:relative}
.search input{width:100%;border:2px solid var(--navy);border-radius:999px;background:#fff;padding:11px 16px 11px 42px;font-weight:600;font-size:14px}
.search input::placeholder{color:#9A9CAE;font-weight:500}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--navy);background:transparent;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--cream)}
.near{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:999px;background:var(--orange);color:#fff;
  padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 3px 0 var(--navy)}
.near:active{transform:translateY(2px);box-shadow:0 1px 0 var(--navy)}
.near img{width:26px;height:26px;border-radius:50%;background:#fff}
.near[aria-busy="true"]{opacity:.7;cursor:progress}

.list{overflow-y:auto;flex:1;padding:6px 0 calc(20px + env(safe-area-inset-bottom,0px))}
.city{border-bottom:1px solid var(--line)}
.city>button{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:0;padding:15px 22px;cursor:pointer;text-align:left}
.city>button h2{margin:0;font-size:17px;font-weight:800}
.count{min-width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;background:var(--gold);color:#fff;font-size:13px;font-weight:800;margin-right:10px}
.city>button .chev{transition:transform .2s}
.city[data-open="false"] .chev{transform:rotate(-90deg)}
.city[data-open="false"] ul{display:none}
.city ul{list-style:none;margin:0;padding:0 12px 10px}
.place{display:flex;gap:12px;padding:11px 10px;border-radius:14px;cursor:pointer;align-items:flex-start}
.place:hover,.place.active{background:var(--cream)}
.place .dot{flex:none;margin-top:2px}
.place b{display:block;font-size:15px;font-weight:700}
.place small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.place .km{margin-left:auto;font-size:13px;font-weight:800;color:var(--orange);white-space:nowrap}
.empty{padding:24px 22px;color:var(--muted);font-weight:600;font-size:14px}
.status{padding:0 22px 8px;font-size:12px;color:var(--muted);font-weight:600;min-height:8px}
.nearhead{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 6px}
.nearhead h2{margin:0;font-size:17px;font-weight:800}
.nearhead button{border:0;background:none;font-weight:700;font-size:13px;color:var(--navy-2);text-decoration:underline;cursor:pointer}

/* ---------- markers ---------- */
.cap{width:38px;height:38px;filter:drop-shadow(0 2px 1px rgba(38,50,90,.35));transition:transform .15s}
.cap.big{transform:scale(1.25)}
.me{width:30px;height:30px;border-radius:50%;border:2px solid var(--orange);background:#fff;box-shadow:0 0 0 4px rgba(228,99,43,.25)}
.me img{width:100%;height:100%;border-radius:50%}
.cluster{width:46px;height:46px;border-radius:50%;background:var(--navy);color:var(--cream);display:grid;place-items:center;font-weight:900;font-size:16px;border:3px solid var(--gold)}

/* ---------- popup ---------- */
.leaflet-popup-content-wrapper{border-radius:18px;border:2px solid var(--navy);box-shadow:0 5px 0 var(--navy);background:var(--paper)}
.leaflet-popup-tip{background:var(--navy)}
.leaflet-popup-content{margin:16px 18px;min-width:220px}
.pop h3{margin:0 0 2px;font-size:17px;font-weight:800;color:var(--navy)}
.pop .type{font-size:12px;font-weight:700;color:var(--gold)}
.pop .addr{margin:10px 0 0;font-size:14px;font-weight:600;line-height:1.35}
.pop .old{display:block;font-size:12px;color:var(--muted);font-weight:500}
.pop .note{margin:8px 0 0;font-size:13px;line-height:1.4;color:var(--navy-2)}
.pop .acts{display:flex;gap:8px;margin-top:13px}
.pop a{text-decoration:none;font-weight:800;font-size:13px;border-radius:999px;padding:8px 13px}
.pop a.go{background:var(--orange);color:#fff}
.pop a.ig{border:2px solid var(--navy);color:var(--navy);padding:6px 12px}
.pop .approx{margin-top:8px;font-size:12px;color:var(--orange);font-weight:700}

.leaflet-control-attribution{font-size:10px;background:rgba(250,249,244,.8)!important}
.leaflet-bar a{color:var(--navy)!important;border-color:var(--line)!important}

.handle{display:none}

/* ---------- mobile: bottom sheet ---------- */
.mhead,.fab,.toast{display:none}
@media (max-width:760px){
  :root{--peek:92px}
  .app{display:block;position:relative;overflow:hidden}
  #map{position:absolute;inset:0;z-index:0}
  .panel{position:absolute;left:0;right:0;bottom:0;height:72%;border-right:0;border-top:2px solid var(--navy);
    border-radius:22px 22px 0 0;transform:translateY(calc(100% - var(--peek) - env(safe-area-inset-bottom,0px)));transition:transform .28s ease;
    box-shadow:0 -6px 0 rgba(38,50,90,.12);padding-top:0;z-index:700}
  .panel[data-open="true"]{transform:translateY(0)}
  .handle{display:block;width:100%;border:0;background:none;padding:10px 0 8px;cursor:pointer;touch-action:none}
  .handle span{display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
  .panel .head{display:none}
  .near{display:none}
  .tools{padding:0 14px 12px}
  .search input{padding:12px 16px 12px 42px;font-size:16px}
  .status{display:none}

  .mhead{display:flex;align-items:center;gap:9px;position:absolute;z-index:650;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);
    background:var(--paper);border:2px solid var(--navy);border-radius:999px;padding:4px 14px 4px 4px;box-shadow:0 3px 0 var(--navy)}
  .mhead img{width:38px;height:38px;border-radius:50%}
  .mhead b{font-size:16px;font-weight:900;color:var(--navy)}

  .fab{display:grid;place-items:center;position:absolute;z-index:650;right:14px;
    bottom:calc(var(--peek) + env(safe-area-inset-bottom,0px) + 16px);width:62px;height:62px;border-radius:50%;
    background:var(--orange);border:0;box-shadow:0 4px 0 var(--navy);cursor:pointer;transition:opacity .2s}
  .fab img{width:46px;height:46px;border-radius:50%;background:#fff}
  .fab[aria-busy="true"]{opacity:.6}
  .panel[data-open="true"] ~ .fab{opacity:0;pointer-events:none}

  .toast{display:block;position:absolute;z-index:660;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 66px);
    background:var(--navy);color:var(--cream);border-radius:14px;padding:11px 14px;font-size:13px;font-weight:600;line-height:1.35;
    opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.show{opacity:1;transform:none}

  .leaflet-control-zoom{display:none}
  .leaflet-bottom{bottom:calc(var(--peek) + env(safe-area-inset-bottom,0px))}
  .leaflet-control-attribution{font-size:9px}
  .leaflet-popup-content{margin:14px 16px}
}
/* ---------- режим редагування (?admin) ---------- */
.admin{position:fixed;z-index:900;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:min(340px,calc(100vw - 24px));
  background:var(--paper);border:2px solid var(--navy);border-radius:16px;box-shadow:0 4px 0 var(--navy);padding:12px 14px;font-size:13px;font-weight:600}
.admin b{display:block;font-size:14px;font-weight:800;margin-bottom:4px}
.admin p{margin:0 0 8px;line-height:1.35;color:var(--navy-2)}
.admin button{border:0;border-radius:999px;background:var(--orange);color:#fff;font-weight:800;padding:9px 14px;cursor:pointer;width:100%}
.admin textarea{width:100%;height:90px;margin-top:8px;font:11px/1.3 monospace;border:1px solid var(--line);border-radius:8px;display:none}
@media (max-width:760px){.admin{top:calc(env(safe-area-inset-top,0px) + 64px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ---------- geocoding (Photon + Nominatim, з кешем у браузері) ---------- */
let cache={}; try{cache=JSON.parse(localStorage.getItem(CACHE_KEY)||'{}')}catch(e){}
const saveCache=()=>{try{localStorage.setItem(CACHE_KEY,JSON.stringify(cache))}catch(e){}};
const inBox=(city,lat,lng)=>{const b=CITY_BOX[city];return !b||(lat>=b[0]&&lat<=b[2]&&lng>=b[1]&&lng<=b[3])};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

const norm=t=>(t||'').toLowerCase().replace(/[’'`ʼ]/g,"'").replace(/^(вулиця|вул\.|провулок|проспект|дорога)\s+/,'').trim();
const streetOk=(found,street)=>{ // назва вулиці в результаті має збігатися з нашою
  const a=norm(found), w=norm(street).split(/\s+/).pop();
  return !!a && !!w && a.includes(w);
};
async function photon(p,street){
  const b=CITY_BOX[p.city];
  const url=`https://photon.komoot.io/api/?q=${encodeURIComponent(`${street} ${p.house}, ${p.city}`)}&limit=8&lang=default`+(b?`&bbox=${b[1]},${b[0]},${b[3]},${b[2]}`:'');
  const r=await fetch(url); if(!r.ok) return null;
  const j=await r.json();
  const hn=(p.house||'').toLowerCase();
  const hits=(j.features||[]).filter(f=>{
    const pr=f.properties, [lng,lat]=f.geometry.coordinates;
    if(!inBox(p.city,lat,lng)) return false;
    if(['city','district','county','state','country','locality'].includes(pr.type)) return false; // не приймаємо «центр міста»
    return streetOk(pr.street||pr.name, street);
  });
  const exact=hits.find(f=>(f.properties.housenumber||'').toLowerCase()===hn);
  const f=exact||hits[0]; if(!f) return null;
  return {c:[f.geometry.coordinates[1],f.geometry.coordinates[0]], exact:!!exact};
}
let nomQueue=Promise.resolve();
function nominatim(p,street){
  const run=nomQueue.then(()=>nominatimNow(p,street));
  nomQueue=run.catch(()=>{}).then(()=>sleep(1100)); // ліміт Nominatim: 1 запит на секунду
  return run;
}
async function nominatimNow(p,street){
  const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=3&accept-language=uk&country=Україна&city=${encodeURIComponent(p.city)}&street=${encodeURIComponent(p.house+' '+street)}`;
  const r=await fetch(url); if(!r.ok) return null;
  const j=await r.json();
  const hit=(j||[]).find(x=>inBox(p.city,+x.lat,+x.lon) && x.address && streetOk(x.address.road||x.address.pedestrian||'',street));
  if(!hit) return null;
  return {c:[+hit.lat,+hit.lon], exact:!!hit.address.house_number};
}
const keyOf=p=>`${p.city}|${p.street}|${p.house}`;
async function locate(p){
  if(p.coords) return {c:p.coords, exact:true};
  const k=keyOf(p); if(cache[k]) return cache[k];
  const streets=[p.street, p.oldStreet].filter(Boolean);
  let best=null;
  for(const s of streets){ try{const r=await photon(p,s); if(r&&r.exact){best=r;break} if(r&&!best) best=r;}catch(e){} }
  if(!best||!best.exact){
    for(const s of streets){ try{const r=await nominatim(p,s); if(r&&(r.exact||!best)){best=r; if(r.exact) break;}}catch(e){} }
  }
  if(best){cache[k]=best;saveCache()}
  return best;
}

/* ---------- render ---------- */
const markers=[];
function popupHtml(p){
  const addr = p.network ? p.city : `${p.street.replace(/^вулиця /,'вул. ')}, ${p.houseLabel||p.house}`;
  // Маршрут: якщо знаємо картку закладу в Google (placeId), ведемо точно до неї.
  // Якщо ні, ведемо на адресу (без назви, щоб Google не підсунув чужий магазин).
  const addrText = p.network ? p.city : `${p.street}, ${p.house}, ${p.city}`;
  const dest = p.gmaps
    || (p.placeId ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.name+', '+addrText)}&destination_place_id=${p.placeId}`
                  : `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(addrText)}`);
  return `<div class="pop">
    <h3>${p.name}</h3><div class="type">${TYPE_LABEL[p.type]}${p.network?' · мережа':''}</div>
    <p class="addr">${addr}${p.old?`<span class="old">колишня ${p.old}</span>`:''}</p>
    ${p.note?`<p class="note">${p.note}</p>`:''}
    ${p.loc&&!p.loc.exact&&!p.network?`<div class="approx">Точка приблизна, уточнюємо адресу</div>`:''}
    <div class="acts">
      <a class="go" href="${dest}" target="_blank" rel="noopener">${p.network?'Знайти в Google Maps':'Прокласти маршрут'}</a>
      ${p.ig?`<a class="ig" href="https://instagram.com/${p.ig}" target="_blank" rel="noopener">Instagram</a>`:''}
    </div></div>`;
}
function addMarker(i){
  const p=PLACES[i];
  if(!p.loc){ if(!ADMIN) return; const b=CITY_BOX[p.city]; p.loc={c:[(b[0]+b[2])/2,(b[1]+b[3])/2],exact:false,missing:true}; }
  const m=L.marker(p.loc.c,{icon:icon(p.type),title:p.name,keyboard:true,draggable:ADMIN}).bindPopup(()=>popupHtml(p),{maxWidth:280});
  if(ADMIN){ m.bindTooltip(p.name+(p.loc.missing?' (не знайдено)':''),{permanent:!!p.loc.missing,direction:'top',offset:[0,-18]});
    m.on('dragend',()=>{const ll=m.getLatLng(); p.loc={c:[+ll.lat.toFixed(6),+ll.lng.toFixed(6)],exact:true,moved:true};}); }
  m.on('click',()=>setActive(i,false));
  markers[i]=m;
}
function matches(p){
  if(filter!=='all'&&p.type!==filter) return false;
  if(!query) return true;
  const hay=`${p.name} ${p.city} ${p.street||''} ${p.old||''}`.toLowerCase();
  return query.split(/\s+/).every(w=>hay.includes(w));
}
function applyFilterToMarkers(){
  cluster.clearLayers();
  cluster.addLayers(PLACES.map((p,i)=>markers[i]&&matches(p)?markers[i]:null).filter(Boolean));
}
const km=(a,b)=>{const R=6371,t=x=>x*Math.PI/180;const dLa=t(b[0]-a[0]),dLo=t(b[1]-a[1]);
  const h=Math.sin(dLa/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const fmtKm=d=>d<1?`${Math.round(d*1000/10)*10} м`:d<20?`${d.toFixed(1).replace('.',',')} км`:`${Math.round(d)} км`;

const openCities=new Set(CITY_ORDER);
function placeLi(p,i,dist){
  const addr = p.network ? p.note : `${p.street.replace(/^вулиця /,'')}, ${p.houseLabel||p.house}${p.old?` (кол. ${p.old})`:''}`;
  return `<li class="place${i===activeIdx?' active':''}" data-i="${i}" tabindex="0" role="button">
    <span class="dot">${capSvg(p.type).replace('class="cap"','class="cap" style="width:26px;height:26px"')}</span>
    <span><b>${p.name}</b><small>${addr}</small></span>
    ${dist!=null?`<span class="km">${fmtKm(dist)}</span>`:''}</li>`;
}
function renderList(){
  const el=document.getElementById('list');
  const vis=PLACES.map((p,i)=>({p,i})).filter(x=>matches(x.p));
  if(!vis.length){el.innerHTML=`<div class="empty">Нічого не знайшли. Спробуйте іншу вулицю або місто.</div>`;return}
  if(me){
    const withD=vis.filter(x=>x.p.loc).map(x=>({...x,d:km(me,x.p.loc.c)})).sort((a,b)=>a.d-b.d);
    el.innerHTML=`<div class="nearhead"><h2>Найближчі до вас</h2><button id="byCity">Показати по містах</button></div>
      <ul style="list-style:none;margin:0;padding:0 12px">${withD.map(x=>placeLi(x.p,x.i,x.d)).join('')}</ul>`;
    document.getElementById('byCity').onclick=()=>{me=null;renderList()};
    return;
  }
  const groups={};vis.forEach(x=>(groups[x.p.city]??=[]).push(x));
  const rank=c=>{const i=CITY_ORDER.indexOf(c);return i<0?99:i};const cities=Object.keys(groups).sort((a,b)=>rank(a)-rank(b));
  el.innerHTML=cities.map(c=>{
    const open=query?true:openCities.has(c);
    return `<section class="city" data-open="${open}" data-city="${c}">
      <button aria-expanded="${open}"><h2>${c}</h2><span><span class="count">${groups[c].length}</span>
      <svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#26325A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 9 7 7 7-7"/></svg></span></button>
      <ul>${groups[c].map(x=>placeLi(x.p,x.i)).join('')}</ul></section>`}).join('');
}
document.getElementById('list').addEventListener('click',e=>{
  const cityBtn=e.target.closest('.city>button');
  if(cityBtn){const s=cityBtn.parentElement,c=s.dataset.city;openCities.has(c)?openCities.delete(c):openCities.add(c);
    const open=openCities.has(c);s.dataset.open=open;cityBtn.setAttribute('aria-expanded',open);
    if(open){const pts=PLACES.filter(p=>p.city===c&&p.loc).map(p=>p.loc.c); if(pts.length) map.flyToBounds(pts,{...pad(60),maxZoom:14,duration:.6})}
    return}
  const li=e.target.closest('.place'); if(li) setActive(+li.dataset.i,true);
});
document.getElementById('list').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('place')){e.preventDefault();setActive(+e.target.dataset.i,true)}});

function setActive(i,fly){
  activeIdx=i;
  document.querySelectorAll('.place').forEach(n=>n.classList.toggle('active',+n.dataset.i===i));
  const p=PLACES[i],m=markers[i];
  if(fly&&m){
    if(isMobile()) panel.dataset.open='false';
    cluster.zoomToShowLayer(m,()=>{
      const z=Math.max(map.getZoom(),p.network?12:16);
      // на телефоні зсуваємо центр, щоб точка й попап були над шторкою
      const c=isMobile()?map.unproject(map.project(p.loc.c,z).subtract([0,90-PEEK/2]),z):p.loc.c;
      map.flyTo(c,z,{duration:.6});setTimeout(()=>m.openPopup(),650)});
  }
}

    const acc=pos.coords.accuracy||0;
    setMe([pos.coords.latitude,pos.coords.longitude]);
    say(acc>800
      ? `Місце визначено приблизно (точність ~${fmtKm(acc/1000)}).`
      : '');

    nearBtn.removeAttribute('aria-busy');fab.removeAttribute('aria-busy');
    say((err.code===1 ? 'Доступ до геолокації заборонено.' : 'Не вдалося визначити місцезнаходження.')+' Перевірте дозвіл на геолокацію в браузері.',7000);
  },{enableHighAccuracy:true,timeout:10000,maximumAge:0});
};

  renderList();
  if(isMobile()){ const n=near[0]; if(n) say(`Найближче: ${n.p.name}, ${fmtKm(n.d)}. Потягніть список угору, щоб побачити всі.`,5000); }
}

const panel=document.getElementById('panel');
const handle=document.getElementById('handle');
handle.onclick=()=>{panel.dataset.open = panel.dataset.open==='true'?'false':'true'};
// свайп шторки вгору/вниз
let ty=null;
panel.addEventListener('touchstart',e=>{ if(e.target.closest('.list')&&panel.dataset.open==='true'&&document.getElementById('list').scrollTop>0) {ty=null;return} ty=e.touches[0].clientY; },{passive:true});
panel.addEventListener('touchend',e=>{ if(ty==null) return; const dy=e.changedTouches[0].clientY-ty; ty=null;
  if(dy<-40) panel.dataset.open='true'; else if(dy>40) panel.dataset.open='false'; },{passive:true});
document.getElementById('q').addEventListener('focus',()=>{ if(isMobile()) panel.dataset.open='true'; });
map.on('click',()=>{ if(isMobile()&&panel.dataset.open==='true') panel.dataset.open='false'; });

/* ---------- boot ---------- */
(async()=>{
  renderList();
  const todo=PLACES.filter(p=>!p.coords&&!cache[keyOf(p)]).length;
  if(todo) say(`Ставимо точки на карту: 0 / ${PLACES.length}`,60000);
  let done=0;
  // спершу все, що вже є (кеш або ручні координати), потім решту по черзі
  await Promise.all(PLACES.map(async(p,i)=>{
    p.loc=await locate(p); done++;
    if(todo) say(`Ставимо точки на карту: ${done} / ${PLACES.length}`,60000);
    addMarker(i);
  }));
  applyFilterToMarkers(); // усі маркери додаємо разом, один раз
  if(ADMIN){
    const box=document.getElementById('admin'); box.hidden=false;
    document.getElementById('copyCoords').onclick=async()=>{
      const out=PLACES.filter(p=>p.loc&&!p.loc.missing).map(p=>`${p.name} | ${p.street||''} ${p.house||''} | ${p.loc.c[0].toFixed(6)}, ${p.loc.c[1].toFixed(6)}${p.loc.moved?' | виправлено':''}`).join('\n')
        + (PLACES.some(p=>p.loc&&p.loc.missing)?'\nНЕ ПЕРЕСУНУТО: '+PLACES.filter(p=>p.loc&&p.loc.missing).map(p=>p.name).join(', '):'');
      const ta=document.getElementById('coordsOut'); ta.value=out; ta.style.display='block';
      try{ await navigator.clipboard.writeText(out); say('Скопійовано. Надішліть це в чат.'); statusEl.textContent='Скопійовано.'; }
      catch(e){ ta.select(); say('Скопіюйте текст із поля вручну.'); }
    };
  }
  const miss=PLACES.filter(p=>!p.loc);
  say(miss.length ? `Не знайшли на карті: ${miss.map(p=>p.name).join(', ')}` : '');
  const all=PLACES.filter(p=>p.loc).map(p=>p.loc.c);
  if(all.length){
    const b=L.latLngBounds(all);
    map.fitBounds(b,pad(40));
  }
  // одразу показуємо Одесу, бо там більшість точок
  const od=PLACES.filter(p=>p.city==='Одеса'&&p.loc).map(p=>p.loc.c);
  if(od.length) setTimeout(()=>map.flyToBounds(od,{...pad(50),duration:1.2}),600);
  renderList();
})();
</script>
